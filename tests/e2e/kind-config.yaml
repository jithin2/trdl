# Local cluster for end-to-end tests. Three workers, each labelled as its own
# zone, so the zone spread rules in the chart are tested like on AKS.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-1
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-2
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-3
